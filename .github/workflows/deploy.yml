name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` cannot be used: guchho lists platform packages that are not
      # published to npm, which makes the strict lockfile check fail. `npm
      # install` skips the unavailable optional dependencies without failing.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Guchho binary is runnable
        run: |
          node node_modules/guchho/install.js || true
          chmod +x node_modules/@guchho/*/bin/guchho 2>/dev/null || true
          node_modules/@guchho/linux-x64/bin/guchho --version

      - name: Checkout Guchho docs (source of truth)
        uses: actions/checkout@v4
        with:
          repository: guchho/guchho
          ref: main
          path: docs-src

      - name: Build site
        env:
          GUCHO_DOCS: ${{ github.workspace }}/docs-src/docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4