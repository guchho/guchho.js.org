<header class="site-header">
  <div class="site-header-inner">
    <button class="menu-toggle" data-toggle-sidebar aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="{{homeUrl}}">
      <img class="brand-logo" src="{{rootPrefix}}public/logo.png" alt="Guchho logo" width="28" height="28" />
      <span class="brand-name">Guchho</span>
      <span class="brand-tag">docs</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/guide/getting-started/">Docs</a>
      <a href="/api/">API</a>
      <a href="/guide/configuration/">Config</a>
      <a href="/reference/cli/">CLI</a>
      <a href="/plugins/">Plugins</a>
      <a href="/examples/">Examples</a>
    </nav>
    <div class="header-search" data-search-index="/search-index.json">
      <button class="search-toggle" type="button" data-search-open aria-label="Search docs" aria-expanded="false" aria-controls="search-panel">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4 4"/></svg>
        </span>
        <span class="search-label">Search</span>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </button>
      <div class="search-panel" id="search-panel" hidden>
        <div class="search-field">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4 4"/></svg>
          </span>
          <input class="search-input" type="search" data-search-input placeholder="Search the docs…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" />
          <button class="search-close" type="button" data-search-close aria-label="Close search">Esc</button>
        </div>
        <p class="search-status" data-search-status role="status" aria-live="polite"></p>
        <ul class="search-results" id="search-results" data-search-results role="listbox" aria-label="Search results"></ul>
        <p class="search-hint" data-search-hint>
          <span>
            <kbd aria-label="Arrow up"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10V2"/><path d="M2.8 5.2 6 2l3.2 3.2"/></svg></kbd>
            <kbd aria-label="Arrow down"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v8"/><path d="M2.8 6.8 6 10l3.2-3.2"/></svg></kbd>
            to navigate
          </span>
          <span>
            <kbd aria-label="Enter"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v4a2 2 0 0 1-2 2H3"/><path d="M5 6 3 8l2 2"/></svg></kbd>
            to open
          </span>
          <span><kbd>esc</kbd> to close</span>
        </p>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-icon theme-icon-light" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z"/></svg>
        </span>
        <span class="theme-icon theme-icon-dark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.14 1.14M11.66 11.66l1.14 1.14M12.8 3.2l-1.14 1.14M4.34 11.66 3.2 12.8"/></svg>
        </span>
      </button>
      <a class="gh-link" href="{{github}}" target="_blank" rel="noopener noreferrer">
        <span class="gh-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </span>
        <span class="gh-label">GitHub</span>
      </a>
    </div>
  </div>
  <div class="search-backdrop" data-search-backdrop hidden></div>
  <div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>
</header>
